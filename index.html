
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio temporalmente no disponible</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 25px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 15px;
      color: #ffffff;
    }

    p {
      color: #9ca3af;
      line-height: 1.7;
      font-size: 15px;
    }

    .status {
      display: inline-block;
      margin: 25px 0;
      padding: 9px 15px;
      border: 1px solid #713f12;
      background: #271b0c;
      color: #fbbf24;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .timer {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0 25px;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #4b5563;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">⚙️</div>

    <h1>¡Ups! Estamos fuera de servicio</h1>

    <p>
      En estos momentos estamos realizando tareas de
      mantenimiento para mejorar tu experiencia.
      <br>
      Volveremos en unos minutos.
    </p>

    <div class="status">● MANTENIMIENTO EN CURSO</div>

    <div class="timer" id="timer">05:00</div>

    <p>Gracias por tu paciencia.</p>

    <div class="footer">
      HTTP ERROR 503 · SERVICE TEMPORARILY UNAVAILABLE
    </div>
  </main>

  <script>
    let tiempo = 5 * 60;

    const timer = document.getElementById("timer");

    function actualizar() {
      const minutos = Math.floor(tiempo / 60);
      const segundos = tiempo % 60;

      timer.textContent =
        String(minutos).padStart(2, "0") + ":" +
        String(segundos).padStart(2, "0");

      if (tiempo > 0) {
        tiempo--;
      } else {
        tiempo = 5 * 60;
      }
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
